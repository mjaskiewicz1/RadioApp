name: CI

on:
  pull_request:
    branches: ["master"]
    types: [opened, reopened, synchronize, ready_for_review, edited]

jobs:
  conventional-commits:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title against Conventional Commits spec
        uses: amannn/action-semantic-pull-request@v6
        with:
          subjectPattern: ^[A-Z].+$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: conventional-commits
    if: always() && needs.conventional-commits.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          workloads: maui-android

      - name: Configure GitHub Packages
        run: >
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Restore NuGet dependencies
        run: dotnet restore RadioApp/RadioApp.csproj -p:TargetFrameworks=net10.0-android

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --severity info -v diag

      - name: Install JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android project in Release mode
        run: dotnet build RadioApp/RadioApp.csproj -f net10.0-android --no-restore --configuration Release -v minimal